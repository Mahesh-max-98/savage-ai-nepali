name: Savage AI Nepali · Meme to Reels

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many new reels to create (1–20)"
        required: true
        default: "3"
        type: string
      narration:
        description: "Add Nepali female narration"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

concurrency:
  group: meme-to-reels
  cancel-in-progress: false

jobs:
  create-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Nepali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow==11.3.0 "edge-tts>=7.2.0,<8.0"

      - name: Create vertical MP4 reels with female Nepali narration
        env:
          REEL_LIMIT: ${{ inputs.limit || '3' }}
          NARRATION: ${{ inputs.narration != false }}
        run: |
          if [[ "$NARRATION" == "true" ]]; then
            python reel_runner.py --limit "$REEL_LIMIT"
          else
            python reel_runner.py --limit "$REEL_LIMIT" --no-voice
          fi

      - name: Commit generated reels and captions
        run: |
          if [[ -n "$(git status --porcelain reels/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reels/
            git commit -m "Create new Nepali meme reels with narration"
            git push
          else
            echo "No new reels to commit."
          fi

      - name: Upload MP4 reels as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: savage-ai-nepali-reels
          path: reels/ready/*.mp4
          if-no-files-found: warn
          retention-days: 14
