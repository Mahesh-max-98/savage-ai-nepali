name: Savage AI Nepali · Joke & Meme Creator

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what to do"
        required: true
        type: choice
        default: generate
        options:
          - generate
          - status

permissions:
  contents: write

concurrency:
  group: savage-ai-content-creator
  cancel-in-progress: false

jobs:
  create-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-free.txt

      - name: Generate Nepali joke and meme image
        if: inputs.action == 'generate'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python free_runner.py --action generate

      - name: Show content library status
        if: inputs.action == 'status'
        run: python free_runner.py --action status

      - name: Save generated content to repository
        if: inputs.action == 'generate'
        run: |
          git config user.name "savage-ai-content-bot"
          git config user.email "savage-ai-content-bot@users.noreply.github.com"
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m "Add new Nepali joke and meme"
            git push
          fi
